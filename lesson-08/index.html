<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let day = Number(prompt("What's the day? 1 = Monday, 2 = Tuesday, etc."));
 switch(day) {
    case 1:
        alert("Monday: Free day");
        break;
    case 2:
        alert("Tuesday: Driver's Ed @ 3pm");
        break;
    case 3:
        alert("Wednesday: Help counselor after school");
        break;
    case 4:
        alert("Thursday: Driver's Ed @ 3pm");
        break;
    case 5:
        alert("Friday: Dance practice");
        break;
    case 6:
        alert("Saturday: Help Mom with groceries");
        break;
    case 7:
        alert("Sunday: Rest day");
    case 6: case 7:
        alert("It's the weekend!");
    default:
        alert("Invalid day");
 }
    </script>
</body>
</html>
