<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson-08 Challenge</title>
</head>
<body>
    <script>
let day = prompt("What's the day?");
if (day !== null) {
    day = day.toLowerCase()
}
switch(day) {
    case "monday":
        alert("Monday: Free day");
        break;
    case "tuesday":
        alert("Tuesday: Driver's Ed @ 3pm");
        break;
    case "wednesday":
        alert("Wednesday: Help counselor after school");
        break;
    case "thursday":
        alert("Thursday: Driver's Ed @ 3pm");
        break;
    case "friday":
        alert("Friday: Dance practice");
        break;
    case "saturday":
        alert("Saturday: Help Mom with groceries");
        break;
    case "sunday":
        alert("Sunday: Rest day");
        break;
    default:
        alert("No day entered")
}
    </script>
</body>
</html>
