<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope Solutions</title>
</head>
<body>
    <script>
// ---------- Puzzle 1: Same name, different variable ----------
// PREDICTION: 2 3
// ACTUAL: 3 2
// WHY: 3 comes first because it says let left = loseLife(lives), which is 3, then lives evalutes out to 2.
console.log("--- Puzzle 1 ---");
let lives = 3;
function loseLife(lives) {
    lives = lives - 1;
    return lives;
}
let left = loseLife(lives);
console.log(lives, left);

// ---------- Puzzle 2: The unchanged score ----------
// PREDICTION: 100 50
// ACTUAL: 100 50
// WHY: First, 50 is doubled then console.log(num) happens, then console.log(score) is after.
console.log("--- Puzzle 2 ---");
let score = 50;
function doubleIt(num) {
    num = num * 2;
    console.log(num);
}
doubleIt(score);
console.log(score);

// ---------- Puzzle 3: The quiet shout ----------
// PREDICTION: PET dog
// ACTUAL: dog
// WHY: the pet in shout(pet) isn't modified, nor is it the argument for shout(word), so only dog shows up in the log.
console.log("--- Puzzle 3 ---");
function shout(word) {
    word = word.toUpperCase();
}
let pet = "dog";
shout(pet);
console.log(pet);

// MY FIX: Complete shoutFixed so pet ends up as "DOG"
// without making pet global inside the function. (Hint: return)
function shoutFixed(word) {
    // write your code here
    word = word.toUpperCase();
    return pet.toUpperCase();
}
pet = shoutFixed(pet);
console.log("Puzzle 3 fix:", pet);

// ---------- Puzzle 4: The missing keyword ----------
// PREDICTION: Jordan 1
// ACTUAL: Jordan undefined
// WHY: typeof says what type of code round is, and it's a block-scope. It doesn't log the word itself.
// playerName is automatically a global scope because it isn't declared by let, var, or const.
console.log("--- Puzzle 4 ---");
function startGame() {
    playerName = "Jordan";
    let round = 1;
}
startGame();
console.log(playerName);
console.log(typeof round);
    </script>
</body>
</html>
