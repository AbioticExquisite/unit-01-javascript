  <script>
    // Write your code here, one comment above each task
// 1. Change the #pageTitle heading to Art Club 2026 with getElementById and textContent.

// 2. Use getElementsByTagName("h2") to change the first <h2> to Club News and the second to Upcoming Events.

document.getElementsByTagName("h2")[1].textContent = "Upcoming Events"

// 3. Use getElementsByClassName("date") and a for loop to change every TBD to Wednesdays at 3:30.
let date = document.getElementsByClassName("date");

    date[i].textContent = "Wednesdays at 3:30"
}
