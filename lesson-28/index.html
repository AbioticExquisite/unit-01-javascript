// 1. Write showError(id, message): it sets the text of the element with that id to message and its color to red.
function showError(id, message) {
    let box = document.getElementById(id);
    box.textContent = message;
    box.style.color = "red";
}

// 2. Write checkName(): if the name is blank or only spaces, show Enter your name. in #nameError and return false. Otherwise clear the message ("") and return true.
function checkName() {
    if (custName.value.trim() === "") {
        showError("nameError", "Enter your name.")
        return false;
    }
    else {
        showError("nameError", "")
        return true;
    }
}

// 3. Write checkQty(), testing in this order: blank → Enter a quantity.; not a number → Quantity must be a number.; less than 1 or more than 10 → Order 1 to 10 pizzas. Show the message in #qtyError (or clear it) and return true or false.
function checkQty() {
    if (qty.value.trim() === "") {
        showError("qtyError", "Enter a quantity.");
        return false;
    }
    if (isNaN(qty.value)) {
        showError("qtyError", "Quantity must be a number.");
        return false;
    }
    if (qty.value < 1 || qty.value > 10) {
        showError("qtyError", "Order 1 to 10 pizzas.");
        return false;
    }
    showError("qtyError", "")
    return true;
}

// 4. Write checkPromo(): the promo code may be blank, or PIZZA5 typed in any case with any spaces around it. Anything else shows Code not found. in #promoError. Return true or false.
const PROMO = "PIZZA5";

function checkPromo() {
if (promo.value.trim() === "") {
    showError("promoError", "Code not found.");
    return false;
    }
if (promo.value.trim().toLowerCase() === PROMO.toLowerCase()) {
    showError("promoError", "Enter a valid promo code.");
  return false;
}
showError("promoError", "")
return true;
}

custName.addEventListener("blur", checkName);
qty.addEventListener("blur", checkQty);
promo.addEventListener("blur", checkPromo);
